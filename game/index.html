<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hollow Lantern</title>
<meta name="description" content="A gothic hunt through a fog-drowned graveyard. Swing your axe, keep your lantern lit and survive the hollow.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game.css">
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Hollow Lantern game"></canvas>
  <div id="touch" aria-hidden="true">
    <div class="pad">
      <button data-k="left">&#9664;</button>
      <button data-k="right">&#9654;</button>
      <button data-k="down">Duck</button>
    </div>
    <div class="pad actions">
      <button data-k="swap">Swap</button>
      <button data-k="heal">Vial</button>
      <button data-k="dodge">Roll</button>
      <button data-k="jump">Jump</button>
      <button data-k="heavy">Heavy</button>
      <button data-k="attack" class="big">Attack</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
